<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="data:,">
<title>AI 行测破壁者</title>

<link rel="stylesheet" href="css/style.css">

<script>
(function(){
  try {
    var t = localStorage.getItem('xc_theme') || 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0"></script>

<script src="js/config.js"></script>
<script src="js/db.js"></script>

<script src="js/tools.js"></script>
<script src="js/ocr.js"></script>
<script src="js/sync.js"></script>


<script src="js/render.js"></script>

</head>
<body>

<header class="topbar">
  <div class="wrap topbar-row">
    <div class="brand">
      <div class="brand-logo">行</div>
      <div class="brand-name">AI 行测破壁者</div>
      <div class="brand-sub">Xingce Smart Copilot</div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="timerBtn" title="行测防烧屏计时器" aria-label="计时器" onclick="location.href='timer.html'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </button>
      <button class="icon-btn" id="themeToggle" title="切换主题" aria-label="切换主题">
        <svg class="ico-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="ico-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="设置" aria-label="设置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <div id="statusChip" class="status-chip gray">
        <span class="dot"></span><span>加载中...</span>
      </div>
    </div>
  </div>
  <div class="wrap">
    <nav class="nav">
      <button data-mode="collect">错题收录</button>
      <button data-mode="exam">错题考试</button>
      <button data-mode="browse">错题查看</button>
      <button data-mode="notes">个人笔记</button>
      <button data-mode="words">词库</button>
      <button data-mode="analysis">AI 分析</button>
    </nav>
  </div>
</header>

<main class="wrap" id="view"></main>
<div class="wrap footer-note" id="footerNote"></div>

<!-- 图片编辑器 -->
<div class="image-editor-modal" id="imageEditorModal">
  <div class="image-editor-content">
    <div class="image-editor-header">
      <div class="image-editor-title">✂️ 编辑图片</div>
      <button class="image-editor-close" title="关闭">×</button>
    </div>
    <div class="image-editor-stage">
      <div class="image-editor-canvas-wrap">
        <img class="image-editor-img" alt="待编辑图片">
        <div class="image-editor-crop">
          <div class="crop-handle tl"></div>
          <div class="crop-handle tr"></div>
          <div class="crop-handle bl"></div>
          <div class="crop-handle br"></div>
        </div>
      </div>
    </div>
    <div class="image-editor-toolbar">
      <button class="btn sm" data-action="rotate-left">↶ 左转</button>
      <button class="btn sm" data-action="rotate-right">↷ 右转</button>
      <button class="btn sm ghost" data-action="reset">重置</button>
      <div class="spacer"></div>
      <button class="btn sm ghost" data-action="skip">用原图</button>
      <button class="btn sm ghost" data-action="cancel">取消</button>
      <button class="btn sm primary" data-action="confirm">✓ 确认</button>
    </div>
  </div>
</div>
<button id="backToTop" title="返回顶部" aria-label="返回顶部">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="18 15 12 9 6 15"/>
  </svg>
</button>
<script src="js/boot.js"></script>
</body>
</html>
