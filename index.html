/* ---- 事件绑定 ---- */
function bindAnalysisEvents(view, scope) {
  // 面包屑
  view.querySelectorAll('[data-crumb-level]').forEach(el => {
    el.addEventListener('click', () => {
      const lv = el.dataset.crumbLevel;
      if (lv === 'root') navToAnalysis(null, null, null);
      else if (lv === 'module') navToAnalysis(state.analysis.module, null, null);
      else if (lv === 'type') navToAnalysis(state.analysis.module, state.analysis.type, null);
    });
  });

  // 钻取卡片
  view.querySelectorAll('[data-nav-level]').forEach(el => {
    el.addEventListener('click', () => {
      const lv = el.dataset.navLevel;
      const val = el.dataset.navValue;
      if (lv === 'module') navToAnalysis(val, null, null);
      else if (lv === 'type') navToAnalysis(state.analysis.module, val, null);
      else if (lv === 'kp') navToAnalysis(state.analysis.module, state.analysis.type, val);
    });
  });

  const goto = view.querySelector('#analysis-goto-settings');
  if (goto) goto.addEventListener('click', openSettings);

  const gen = view.querySelector('#gen-report');
  if (gen) gen.addEventListener('click', generateReport);

  const regen = view.querySelector('#regen-report');
  if (regen) regen.addEventListener('click', () => {
    if (!confirm('重新生成会覆盖当前报告，确定？')) return;
    generateReport();
  });
    // 记录折叠状态
  view.querySelectorAll('details[data-collapse-key]').forEach(d => {
    d.addEventListener('toggle', () => {
      localStorage.setItem(d.dataset.collapseKey, d.open ? '0' : '1');
    });
  });
}

/* ---- 切换范围 ---- */
async function navToAnalysis(module, type, kp) {
  const a = state.analysis;
  a.module = module || null;
  a.type = type || null;
  a.kp = kp || null;
  a.report = null;
  a.loading = false;
  renderView();

  // 尝试读缓存
  const key = analysisCacheKey();
  try {
    const cached = await getMeta(key);
    // 检查用户是否还在同一范围
    if (analysisCacheKey() !== key) return;
        const CACHE_TTL = 14 * 24 * 3600 * 1000;   // 14 天
    if (cached && cached.generatedAt && Date.now() - cached.generatedAt < CACHE_TTL) {
      a.report = cached;
      renderView();
    }
  } catch (e) { /* ignore */ }
}

/* ---- 生成 AI 报告 ---- */
async function generateReport() {
  if (!getApiKey()) { alert('请先配置 API Key'); return; }
  const a = state.analysis;
  a.loading = true;
  renderView();

  try {
    const scope = getAnalysisScope();
    const apiKey = getApiKey();
    const level = getAnalysisLevel();   // 'all' | 'module' | 'type' | 'kp'

    // 构造用户数据
    const dataPayload = buildAnalysisPayload(scope, level);

    // 按层级选 system prompt
    const sys = buildAnalysisPrompt(level);

    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [
          { role: 'system', content: sys },
          { role: 'user', content: dataPayload }
        ],
        response_format: { type: 'json_object' },
        temperature: 0.4
      })
    });
    if (!res.ok) throw new Error('API 请求失败 (' + res.status + ')');
    const data = await res.json();
    const parsed = JSON.parse(data.choices?.[0]?.message?.content || '{}');

    const report = {
      _v: 2,
      level,
      scope: { module: a.module, type: a.type, kp: a.kp },
      ...parsed,
      generatedAt: Date.now()
    };

    a.report = report;
    a.loading = false;
    await setMeta(analysisCacheKey(), report);
    renderView();
  } catch (e) {
    a.loading = false;
    alert('生成失败：' + e.message);
    renderView();
  }
}

/* 判断当前面包屑层级 */
function getAnalysisLevel() {
  const a = state.analysis;
  if (a.kp) return 'kp';
  if (a.type) return 'type';
  if (a.module) return 'module';
  return 'all';
}

/* 构造给 AI 的数据 */
function buildAnalysisPayload(scope, level) {
  const a = state.analysis;
  const lines = [];

  lines.push(`【层级】${scope.path.map(p => p.label).join(' > ')}`);
  lines.push(`【错题总数】${scope.list.length}`);
  lines.push(`【累计答错次数】${scope.totalWrong}`);

  const rep3 = scope.list.filter(q => (q.wrongCount || 0) >= 3).length;
  const rep5 = scope.list.filter(q => (q.wrongCount || 0) >= 5).length;
  lines.push(`【反复错（≥3次）】${rep3} 道`);
  if (rep5) lines.push(`【顽固错（≥5次）】${rep5} 道`);
  lines.push('');

  const dist = { '1次': 0, '2次': 0, '3-4次': 0, '5次+': 0 };
  scope.list.forEach(q => {
    const w = q.wrongCount || 0;
    if (w <= 1) dist['1次']++;
    else if (w === 2) dist['2次']++;
    else if (w <= 4) dist['3-4次']++;
    else dist['5次+']++;
  });
  const distStr = Object.entries(dist).filter(([k,v]) => v).map(([k,v]) => `${k}: ${v}道`).join('，');
  lines.push(`【错误次数分布】${distStr}`);
  lines.push('');

  if (level === 'all') {
    const byModule = {};
    scope.list.forEach(q => {
      const m = q.module || '未分类';
      if (!byModule[m]) byModule[m] = { count: 0, wrong: 0, types: {}, kps: {} };
      byModule[m].count++;
      byModule[m].wrong += q.wrongCount || 0;
      if (q.type) byModule[m].types[q.type] = (byModule[m].types[q.type] || 0) + 1;
      (q.knowledgePoints || []).forEach(k => {
        byModule[m].kps[k] = (byModule[m].kps[k] || 0) + (q.wrongCount || 0);
      });
    });
    lines.push('【各模块错题分布（按累计答错次数降序）】');
    Object.entries(byModule).sort((x, y) => y[1].wrong - x[1].wrong).forEach(([m, s]) => {
      const topTypes = Object.entries(s.types).sort((x, y) => y[1] - x[1]).slice(0, 5)
        .map(([t, c]) => `${t}(${c}题)`).join('、');
      const topKps = Object.entries(s.kps).sort((x, y) => y[1] - x[1]).slice(0, 5)
        .map(([k, c]) => `${k}(错${c}次)`).join('、');
      lines.push(`- ${m}：${s.count} 题，累计错 ${s.wrong} 次`);
      lines.push(`  常错题型：${topTypes || '—'}`);
      lines.push(`  常错知识点：${topKps || '—'}`);
    });
    lines.push('');
  }

  if (level === 'module' || level === 'type') {
    const byType = {};
    scope.list.forEach(q => {
      const t = q.type || '未分类';
      if (!byType[t]) byType[t] = { count: 0, wrong: 0, kps: {}, repeated: 0 };
      byType[t].count++;
      byType[t].wrong += q.wrongCount || 0;
      if ((q.wrongCount || 0) >= 3) byType[t].repeated++;
      (q.knowledgePoints || []).forEach(k => {
        byType[t].kps[k] = (byType[t].kps[k] || 0) + (q.wrongCount || 0);
      });
    });
    lines.push('【各题型错题分布（按累计答错次数降序）】');
    Object.entries(byType).sort((x, y) => y[1].wrong - x[1].wrong).forEach(([t, s]) => {
      const topKps = Object.entries(s.kps).sort((x, y) => y[1] - x[1]).slice(0, 6)
        .map(([k, c]) => `${k}(错${c}次)`).join('、');
      lines.push(`- ${t}：${s.count} 题，累计错 ${s.wrong} 次，反复错 ${s.repeated} 道`);
      lines.push(`  常错知识点：${topKps || '—'}`);
    });
    lines.push('');
  }

  if (scope.freq.length) {
    lines.push('【知识点错误频次】');
    scope.freq.slice(0, 15).forEach(f => {
      lines.push(`- ${f.kp}：${f.count} 题，累计错 ${f.wrongSum} 次`);
    });
    lines.push('');
  }

  /* 误选模式 —— 判断错误类型的关键 */
  const wrongChoiceMap = {};
  scope.list.forEach(q => {
    (q.wrongHistory || []).forEach(sel => {
      const optText = (q.options[sel] || '').slice(0, 20);
      if (!optText) return;
      wrongChoiceMap[optText] = (wrongChoiceMap[optText] || 0) + 1;
    });
    (q.attemptHistory || []).forEach(h => {
      if (h.ok) return;
      const optText = (q.options[h.sel] || '').slice(0, 20);
      if (!optText) return;
      wrongChoiceMap[optText] = (wrongChoiceMap[optText] || 0) + 1;
    });
  });
  const topWrong = Object.entries(wrongChoiceMap).sort((a, b) => b[1] - a[1]).slice(0, 10);
  if (topWrong.length) {
    lines.push('【经常被误选的选项内容（截断 20 字，反映错误模式）】');
    topWrong.forEach(([t, c]) => lines.push(`- "${t}"：误选 ${c} 次`));
    lines.push('');
  }

  lines.push('【错题明细（按错误次数降序，最多 25 条）】');
  const sorted = [...scope.list].sort((a, b) => (b.wrongCount || 0) - (a.wrongCount || 0)).slice(0, 25);
  sorted.forEach((q, i) => {
    lines.push(`${i + 1}. [错${q.wrongCount || 0}次] ${q.module} · ${q.type}`);
    lines.push(`   知识点：${(q.knowledgePoints || []).join('、')}`);
    lines.push(`   题干：${q.stem.slice(0, 100)}${q.stem.length > 100 ? '…' : ''}`);
    lines.push(`   正确答案：${String.fromCharCode(65 + q.correctIdx)}. ${q.options[q.correctIdx]}`);
    const wrongOpts = (q.wrongHistory || []).map(i => `选${String.fromCharCode(65 + i)}. ${q.options[i].slice(0, 15)}`);
    if (wrongOpts.length) lines.push(`   曾错选：${wrongOpts.join('；')}`);
  });

  return lines.join('\n');
}

/* ============ 导航辅助 ============ */
function openSettings() {
  try {
    if (state.mode !== 'settings') {
      // 记住进入设置前的 Tab（供返回用）
      localStorage.setItem('xc_last_non_settings', state.mode);
      state.prevMode = state.mode;
    }
    state.mode = 'settings';
    saveCurrentMode();
    renderView();
  } catch (err) {
    console.error('打开设置失败：', err);
    alert('打开设置失败：' + err.message);
  }
}

function goBack() {
  // 从设置页返回时，优先用最近一次非 settings 的 Tab
  if (state.mode === 'settings') {
    const lastNonSettings = localStorage.getItem('xc_last_non_settings');
    state.mode = (lastNonSettings && ['collect','exam','browse','analysis'].includes(lastNonSettings))
      ? lastNonSettings
      : (state.prevMode && state.prevMode !== 'settings' ? state.prevMode : 'collect');
  } else {
    state.mode = state.prevMode || 'collect';
  }
  saveCurrentMode();
  renderView();
}

/* ============ 主渲染 ============ */
function renderView() {
  // 主 nav 高亮
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
  // 设置图标高亮
  const setBtn = document.getElementById('settingsBtn');
  if (setBtn) setBtn.classList.toggle('active', state.mode === 'settings');

  const view = document.getElementById('view');
  if (state.mode === 'collect') renderCollect(view);
  else if (state.mode === 'exam') renderExam(view);
  else if (state.mode === 'browse') renderBrowse(view);
  else if (state.mode === 'notes') renderNotes(view);
  else if (state.mode === 'analysis') renderAnalysis(view);
  else if (state.mode === 'settings') renderSettings(view);
  updateStatusChip();
}

/* ============ 存储用量估算 ============ */
function fmtBytes(b) {
  if (!b) return '0 B';
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1024 / 1024).toFixed(2) + ' MB';
}

async function estimateIndexedDBSize() {
  try {
    // 用缓存值 + 新增题目的估算，避免每次全量序列化
    const base = _cachedStorage.idbSize || 0;
    if (!base) {
      const json = JSON.stringify(questions) + JSON.stringify(settings || {});
      return new Blob([json]).size;
    }
    return base;
  } catch { return 0; }
}

async function estimateCacheSize() {
  if (!('caches' in window)) return 0;
  try {
    const names = await caches.keys();
    let total = 0;
    for (const name of names) {
      const cache = await caches.open(name);
      const keys = await cache.keys();
      for (const req of keys) {
        const res = await cache.match(req);
        if (res) {
          try {
            const blob = await res.clone().blob();
            total += blob.size;
          } catch { /* 忽略无法读取的响应 */ }
        }
      }
    }
    return total;
  } catch { return 0; }
}

/* ============ 清理 OCR 缓存（不动错题库） ============ */
async function clearOcrCache() {
  if (!('caches' in window)) {
    showToast('当前环境不支持缓存清理');
    return;
  }
  try {
    const names = await caches.keys();
    if (!names.length) {
      showToast('没有可清理的缓存');
      return;
    }
    await Promise.all(names.map(n => caches.delete(n)));
    showToast(`已清理 ${names.length} 个 OCR 缓存`);
    updateStatusChip();
    renderView();
  } catch (e) {
    alert('清理失败：' + e.message);
  }
}

let _cachedStorage = { idbSize: 0, cacheSize: 0, ts: 0 };

async function updateStatusChip() {
  const chip = document.getElementById('statusChip');
  const foot = document.getElementById('footerNote');
  if (!chip) return;

  if (!useIDB) {
    chip.className = 'status-chip gray';
    chip.innerHTML = '<span class="dot"></span><span>localStorage 模式</span>';
    return;
  }

  chip.className = 'status-chip';

  // 5 分钟内的缓存直接复用，不重新计算（避免闪烁）
  const cacheFresh = _cachedStorage.ts && (Date.now() - _cachedStorage.ts < 5 * 60 * 1000);
  if (!cacheFresh) {
    // 首次或缓存过期 → 先显示占位，避免闪成"计算中"
    if (!_cachedStorage.ts) {
      chip.innerHTML = `<span class="dot"></span><span>IDB ${questions.length}题</span>`;
    }
    try {
      const [idbSize, cacheSize] = await Promise.all([
        estimateIndexedDBSize(),
        estimateCacheSize()
      ]);
      _cachedStorage = { idbSize, cacheSize, ts: Date.now() };
    } catch {}
  }

  const { idbSize, cacheSize } = _cachedStorage;
  chip.innerHTML = `
    <span class="dot"></span>
    <span>IDB ${questions.length}题 · ${fmtBytes(idbSize)}</span>
    <span style="opacity:.4;margin:0 3px">|</span>
    <span>Cache ${fmtBytes(cacheSize)}</span>
  `;

  if (foot) foot.textContent = `错题库保存在本机 IndexedDB · 定期导出备份`;
}

/* 强制刷新存储缓存（数据变化时调用） */
function invalidateStorageCache() {
  _cachedStorage.ts = 0;
}

/* ============ 全局粘贴 ============ */
document.addEventListener('paste', e => {
  if (state.mode !== 'collect') return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  const files = [];
  for (const item of items) {
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      const f = item.getAsFile();
      if (f) files.push(f);
    }
  }
  if (!files.length) return;
  e.preventDefault();

  // 复用 handleFiles 的逻辑
  const s2 = state.collect;
  Promise.all(files.map(f => new Promise(res => {
    const r = new FileReader();
    r.onload = ev => res({
      id: uid(), file: f, dataUrl: ev.target.result,
      ocrText: '', status: 'pending', error: ''
    });
    r.onerror = () => res(null);
    r.readAsDataURL(f);
  }))).then(items2 => {
    for (const it of items2) {
      if (!it) continue;
      s2.images.push(it);
      appendImageThumb(it);
    }
    updateImagesCountLabel();
    updateCollectFooter();
    setTimeout(() => processAllImages(), 30);
  });
});

/* ============ 全局快捷键 ============ */
document.addEventListener('keydown', e => {
  const isMac = navigator.platform.toUpperCase().includes('MAC');
  const mod = isMac ? e.metaKey : e.ctrlKey;

  /* F1-F4 切换主界面（F5 不劫持，留给浏览器刷新） */
  if (['F1','F2','F3','F4'].includes(e.key)) {
    e.preventDefault();
    const map = { 'F1': 'collect', 'F2': 'exam', 'F3': 'browse', 'F4': 'notes' };
    const target = map[e.key];
    state.mode = target;
    state.prevMode = target;
    saveCurrentMode();
    renderView();
    return;
  }

  /* Ctrl/Cmd + K：打开搜索框（错题查看页） */
  if (mod && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    // 如果当前在详情页或编辑页，先退回列表
    if (state.mode === 'browse' && (state.browse.selectedId || state.browse.editing)) {
      state.browse.selectedId = null;
      state.browse.detail = null;
      state.browse.editing = false;
      state.browse.editDraft = null;
    }
    if (state.mode !== 'browse') {
      state.mode = 'browse';
      state.prevMode = 'browse';
    }
    renderView();
    setTimeout(() => {
      const inp = document.getElementById('browse-search');
      if (inp) { inp.focus(); inp.select(); }
      else { showToast('当前没有搜索框'); }
    }, 50);
    return;
  }

  /* Ctrl/Cmd + S：立即同步到 Gist */
  if (mod && e.key.toLowerCase() === 's') {
    e.preventDefault();
    if (!getGistId() || !getGistToken()) {
      showToast('未配置云同步');
      return;
    }
    syncNow();
    return;
  }

  /* Ctrl/Cmd + E：导出备份 */
  if (mod && e.key.toLowerCase() === 'e') {
    e.preventDefault();
    exportBackup();
    return;
  }

  /* ESC：原有逻辑 */
  if (e.key === 'Escape') {
    if (state.mode === 'browse' && state.browse.selectedId) {
      state.browse.pendingScrollRestore = state.browse.listScrollY || 0;
      state.browse.selectedId = null;
      state.browse.detail = null;
      renderView();
      persistBrowseState();
      return;
    }
    if (state.mode === 'settings') { goBack(); return; }
  }

  /* 其他快捷键（考试、Enter 等）保持原有代码 */
  const tag = (e.target.tagName || '').toLowerCase();
  const isEditing = tag === 'input' || tag === 'textarea' || tag === 'select';
  if (isEditing) return;

  // 考试模式
  if (state.mode === 'exam') {
    const ex = state.exam;
    if (ex.stage === 'running') {
      const q = ex.quiz[ex.current];
      if (!q) return;
      if (!q.answered && ['1','2','3','4'].includes(e.key)) {
        selectExamOption(parseInt(e.key) - 1);
      } else if (q.answered && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        if (ex.current === ex.quiz.length - 1) finishExam();
        else { ex.current++; renderView(); }
      }
    }
  }
});

  try {
    const CLEAN_FLAG = 'xc_analysis_cleaned_v2';
    if (!localStorage.getItem(CLEAN_FLAG)) {
      const allMeta = useIDB ? await idbGetAll('meta') : [];
      const oldKeys = allMeta
        .filter(m => m.key && m.key.startsWith('analysis:'))
        .filter(m => !m.value || !m.value.level || m.value._v !== 2)
        .map(m => m.key);
      if (oldKeys.length && useIDB) {
        for (const k of oldKeys) {
          await new Promise(r => {
            const tx = db.transaction('meta', 'readwrite');
            tx.objectStore('meta').delete(k);
            tx.oncomplete = r; tx.onerror = r;
          });
        }
        console.log(`[清理] 删除 ${oldKeys.length} 条旧报告缓存`);
      }
      localStorage.setItem(CLEAN_FLAG, '1');
    }
  } catch (e) { console.warn('清理旧缓存失败：', e); }

  // 恢复上次所在 Tab（含设置页）
  const savedMode = localStorage.getItem('xc_mode');
  const validModes = ['collect','exam','browse','notes','analysis','settings'];
  if (savedMode && validModes.includes(savedMode)) {
    state.mode = savedMode;
    state.prevMode = savedMode === 'settings' ? (state.prevMode || 'collect') : savedMode;
  }
    // 恢复 AI 分析页当前层级的缓存报告（14 天内有效）
  if (state.mode === 'analysis') {
    try {
      const key = analysisCacheKey();
      const cached = await getMeta(key);
      const CACHE_TTL = 14 * 24 * 3600 * 1000;
      if (cached && cached.generatedAt && Date.now() - cached.generatedAt < CACHE_TTL) {
        state.analysis.report = cached;
        console.log('[AI分析] 已从缓存恢复报告');
      }
    } catch (e) { console.warn('[AI分析] 恢复缓存失败：', e); }
  }

  // 恢复更细的浏览状态
  const lastBrowse = loadBrowseState();
  let restoreScrollY = 0;

  // 只有当前 Tab 是 browse 时，才恢复它的详细状态
  // 其他 Tab 忽略 lastBrowse，避免被强行拉回错题查看
  if (lastBrowse && state.mode === 'browse') {
    restoreScrollY = Number(lastBrowse.scrollY) || 0;

    // 恢复筛选条件
    if (lastBrowse.filter && typeof lastBrowse.filter === 'object') {
      state.browse.filter = {
        module: lastBrowse.filter.module || 'all',
        type: lastBrowse.filter.type || 'all',
        knowledgePoints: Array.isArray(lastBrowse.filter.knowledgePoints)
          ? lastBrowse.filter.knowledgePoints
          : []
      };
    }

    if (lastBrowse.selectedId) {
      const q = questions.find(x => x.id === lastBrowse.selectedId);
      if (q) {
        state.browse.selectedId = q.id;
        state.browse.detail = { question: q, similar: [] };
        state.browse.generating = { analysis: false, similar: false };
        const filtered = filterQuestions(state.browse.filter);
        state.browse.listIds = sortBrowseList(filtered).map(x => x.id);
        state.browse.listScrollY = 0;
        state.browse.pendingScrollRestore = null;
      }
    }
  }

    // 一次性清掉历史遗留的 stale selectedId（只在非 browse 页时）
  if (state.mode !== 'browse') {
    try {
      const raw = localStorage.getItem('xc_browse_state');
      if (raw) {
        const s = JSON.parse(raw);
        if (s.selectedId) {
          s.selectedId = null;
          localStorage.setItem('xc_browse_state', JSON.stringify(s));
        }
      }
    } catch {}
  }

  renderView();

  // 页面打开后 2 秒，自动 PULL 一次
  if (getGistId() && getGistToken()) {
    setTimeout(() => {
      pullFromGist().then(() => renderView()).catch(() => {});
    }, 2000);
  }
    // 清洗历史数据：去掉选项内容里可能残留的 "A." "B、" 等前缀
  let cleaned = 0;
  questions.forEach(q => {
    if (!Array.isArray(q.options)) return;
    if (typeof q.personalNote !== 'string') q.personalNote = '';
    if (typeof q.personalNoteUpdatedAt !== 'number') q.personalNoteUpdatedAt = 0;
    const cleanedOpts = q.options.map(s => stripOptionPrefix(s));
    if (JSON.stringify(cleanedOpts) !== JSON.stringify(q.options)) {
      q.options = cleanedOpts;
      dirtyQ.add(q.id);
      cleaned++;
    }
  });
  if (cleaned) {
    console.log(`[清洗] 修复了 ${cleaned} 道题的选项前缀`);
    scheduleFlush();
  }


  // 后台预热 PaddleOCR
  if (canUsePaddle() && !_paddleFailed) {
    setTimeout(() => {
      console.log('[预热] 开始加载 PaddleOCR…');
      const t0 = performance.now();
      initPaddleOCR()
        .then(() => {
          console.log(`[预热] PaddleOCR 就绪，耗时 ${((performance.now() - t0) / 1000).toFixed(1)}s`);
          // 如果当前在错题收录页，自动刷新 UI 以更新状态文字
          if (state.mode === 'collect') renderView();
        })
        .catch(e => console.warn('[预热] PaddleOCR 加载失败：', e.message));
    }, 2000);
  }
  // 注册 Service Worker 缓存 OCR 资源
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').then(reg => {
      console.log('[SW] 已注册');
    }).catch(err => {
      console.warn('[SW] 注册失败：', err.message);
    });
  }
    // 恢复滚动位置
  if (restoreScrollY > 0) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      window.scrollTo({ top: restoreScrollY, behavior: 'instant' });
      document.documentElement.scrollTop = restoreScrollY;
      document.body.scrollTop = restoreScrollY;
    }));
  }

  // 首次打开引导（只提示一次）
  if (!localStorage.getItem('xc_welcomed')) {
    localStorage.setItem('xc_welcomed', '1');
    setTimeout(() => showWelcome(), 800);
  }
  window.addEventListener('beforeunload', () => {
    if (!useIDB) return;
    try {
      if (dirtyQ.size) {
        const toSave = questions.filter(q => dirtyQ.has(q.id));
        if (toSave.length) idbBulkPut('questions', toSave);
      }
      if (lastSyncedAt) setMeta('lastSyncedAt', lastSyncedAt);
    } catch {}
  });
  // 滚动时持续记录位置（仅在有 selectedId 或处于列表页时）
  window.addEventListener('scroll', () => {
    // 只记录错题查看页的滚动位置（其他页面无意义）
    if (state.mode === 'browse') {
      persistScrollThrottled();
    }
  }, { passive: true });
})();

function showWelcome() {
  const tip = document.createElement('div');
  tip.id = 'welcomeTip';
  tip.innerHTML = `
    <div class="head">
      <b>👋 欢迎使用行测错题本</b>
      <button id="welcomeClose" title="关闭">×</button>
    </div>
    <p>三步开始：<br>
      1️⃣ 到设置页配置 DeepSeek API Key<br>
      2️⃣ 到「错题收录」截图，<code>Ctrl/Cmd + V</code> 粘贴<br>
      3️⃣ 之后在考试、查看、分析里使用
    </p>
    <div class="acts">
      <button class="btn sm primary" id="welcomeGo">去配置</button>
      <button class="btn sm ghost" id="welcomeSkip">知道了</button>
    </div>
  `;
  document.body.appendChild(tip);
  requestAnimationFrame(() => tip.classList.add('show'));

  const close = () => {
    tip.classList.remove('show');
    setTimeout(() => tip.remove(), 300);
  };
  tip.querySelector('#welcomeClose').addEventListener('click', close);
  tip.querySelector('#welcomeSkip').addEventListener('click', close);
  tip.querySelector('#welcomeGo').addEventListener('click', () => {
    close();
    openSettings();
  });
  setTimeout(close, 15000); // 15 秒后自动消失
}

window.xc = {
  info: () => ({ mode: state.mode, questions: questions.length, useIDB, dirty: dirtyQ.size, theme: getTheme() }),
  questions: () => questions,
  categories: CATEGORIES,
  reset: () => clearAllStores(),
  setTheme: (t) => { localStorage.setItem(K_THEME, t); applyTheme(t); }
};
</script>
</body>
